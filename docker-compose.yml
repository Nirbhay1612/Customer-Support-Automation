version: "3.9"

services:

  # ==========================================================
  # FastAPI Backend
  # ==========================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-automation-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    restart: unless-stopped

    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]


  # ==========================================================
  # Streamlit Dashboard
  # ==========================================================

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-automation-dashboard

    env_file:
      - .env

    ports:
      - "8501:8501"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    depends_on:
      - api

    restart: unless-stopped

    command:
      [
        "streamlit",
        "run",
        "dashboard/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]